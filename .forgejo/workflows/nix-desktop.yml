# The x86_64-linux leg of the desktop Nix build, on the forge (git.burmese-shiner.ts.net, nika's
# host runner). The aarch64-darwin leg stays in .github/workflows/nix-desktop.yml on GitHub's
# macOS runners until the forge has a macOS runner (joyboy, forge phase 2).
#
# THIS IS THE ONLY FORGE WORKFLOW IN THIS REPO. With .forgejo/workflows/ present the forge
# ignores .github/workflows/ (upstream's jobs for pingdotgg's blacksmith runners).
#
# Same build as the GitHub leg, see its comments: no checkout, the flake URL is built so the
# store path is exactly the one `github:yasinuslu/t3code` resolves to on the machines, and the
# result goes to the attic cache (ATTIC_TOKEN is a forge repo secret, a push token minted for
# forge-ci). The build runs on nika's own nix daemon, so nika gets the path straight away.
name: Nix desktop build (linux)

on:
  push:
    branches: [yu-v2]
  workflow_dispatch:

concurrency:
  group: nix-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://nix-cache.nepjua.org/
  ATTIC_CACHE: nepjua

jobs:
  build:
    runs-on: nix
    timeout-minutes: 120
    steps:
      # `origin` pushes to the forge and GitHub at once and the mirror follows within seconds,
      # but the flake URL is a GitHub tarball: wait until GitHub has the commit.
      - name: Wait for the commit on GitHub
        run: |
          for _ in $(seq 60); do
            curl -sf -o /dev/null "https://api.github.com/repos/yasinuslu/t3code/commits/$GITHUB_SHA" && exit 0
            sleep 5
          done
          echo "commit $GITHUB_SHA not on GitHub after 5 min"
          exit 1

      - name: Build
        run: |
          set -euo pipefail
          nix build --print-build-logs --no-link --print-out-paths \
            "github:yasinuslu/t3code/${GITHUB_SHA}#packages.x86_64-linux.default" \
            > "$RUNNER_TEMP/out-paths.txt"
          cat "$RUNNER_TEMP/out-paths.txt"

      - name: Publish to the attic cache
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/attic-config"
          nix run nixpkgs#attic-client -- login "$ATTIC_CACHE" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          xargs nix run nixpkgs#attic-client -- push "$ATTIC_CACHE" < "$RUNNER_TEMP/out-paths.txt"
          rm -rf "$XDG_CONFIG_HOME"

  # SHIP. A green build of a yu-v2 push is what "ship" means: this job pins the commit in
  # platform-gitops (releases/t3code.json), the single source of truth for what T3 Code runs on
  # nika and joyboy. The machines watch that file (`nep t3 autoship`, nepjua flake), build the
  # pinned sha in their own free slot, wait for an idle server, restart it behind a health gate
  # and roll back on failure. A red build never reaches this job, so nothing ships; rolling back
  # is reverting the pin commit there. Write access is a deploy key limited to that one repo.
  ship:
    needs: build
    if: github.event_name == 'push'
    runs-on: nix
    timeout-minutes: 15
    steps:
      - name: Pin this commit in platform-gitops
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          subject=$(curl -sf "https://api.github.com/repos/yasinuslu/t3code/commits/$sha" | jq -r '.commit.message | split("\n")[0]')
          key="$RUNNER_TEMP/gitops_key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          git clone -q --depth 1 ssh://git@git.nepjua.org:2222/yasinuslu/platform-gitops.git "$RUNNER_TEMP/gitops"
          cd "$RUNNER_TEMP/gitops"
          git config user.name forge-ci
          git config user.email forge-ci@git.nepjua.org
          for attempt in 1 2 3 4 5; do
            pinned=$(jq -r .sha releases/t3code.json)
            if [ "$pinned" = "$sha" ]; then echo "already pinned: $sha"; exit 0; fi
            # Never move the pin backwards: a slower run of an older commit can finish after a newer one.
            rel=$(curl -sf "https://api.github.com/repos/yasinuslu/t3code/compare/$pinned...$sha" | jq -r .status || echo unknown)
            if [ "$rel" = behind ]; then echo "pin $pinned is already ahead of $sha"; exit 0; fi
            jq -n --arg sha "$sha" --arg subject "$subject" --arg at "$(date -u +%FT%TZ)" --arg run "$RUN_URL" \
              '{repo: "yasinuslu/t3code", branch: "yu-v2", sha: $sha, subject: $subject, shippedAt: $at, run: $run}' \
              > releases/t3code.json
            git add releases/t3code.json
            git commit -q -m "ship: t3code ${sha:0:7} $subject"
            git push -q origin HEAD:main && { echo "pinned $sha"; exit 0; }
            echo "push raced (attempt $attempt); retrying"
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "could not push the pin"
          exit 1
