<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idea Board (prototype)</title>
    <style>
      :root {
        --bg: #111214;
        --panel: #18191c;
        --card: #212327;
        --card-hover: #282b30;
        --line: #2e3136;
        --text: #e8e6e1;
        --muted: #8f9197;
        --you: #f2b84b;
        --agent: #6aa7ff;
        --good: #6fcf8e;
        --shelf: #7b7d84;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      h1 small {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .tag {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 1px 8px;
      }
      .waiting {
        color: var(--you);
        font-weight: 600;
      }
      .spacer {
        flex: 1;
      }
      .tabs {
        display: flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .tabs button {
        background: none;
        border: 0;
        padding: 5px 12px;
        cursor: pointer;
        color: var(--muted);
      }
      .tabs button.on {
        background: var(--card);
        color: var(--text);
      }
      .ghost {
        background: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        color: var(--muted);
      }
      .ghost:hover {
        color: var(--text);
      }
      .composer {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 8px 8px 12px;
      }
      .composer:focus-within {
        border-color: var(--you);
      }
      .composer textarea {
        flex: 1;
        background: none;
        border: 0;
        outline: none;
        resize: none;
        max-height: 140px;
        padding: 4px 0;
      }
      .send {
        background: var(--you);
        color: #1b1403;
        border: 0;
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .send:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .new {
        padding: 12px 20px 0;
        max-width: 720px;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .board {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(6, minmax(190px, 1fr));
        gap: 10px;
        padding: 14px 20px;
        overflow-x: auto;
      }
      .col {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .col.you {
        border-color: color-mix(in srgb, var(--you) 45%, var(--line));
      }
      .col.over {
        outline: 2px dashed var(--you);
        outline-offset: -4px;
      }
      .col h2 {
        margin: 0;
        padding: 10px 12px 2px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 650;
        display: flex;
        justify-content: space-between;
      }
      .col h2 span {
        color: var(--muted);
        font-weight: 500;
      }
      .col .who {
        padding: 0 12px 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .col.you .who {
        color: var(--you);
      }
      .cards {
        padding: 0 8px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        flex: 1;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
      }
      .card:hover {
        background: var(--card-hover);
      }
      .card .title {
        font-weight: 600;
        line-height: 1.3;
      }
      .card .sub {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .card .last {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
        padding-left: 8px;
        border-left: 2px solid var(--line);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .card .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
        align-items: center;
      }
      .chip {
        font-size: 11px;
        border-radius: 99px;
        padding: 1px 8px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.play {
        color: #1b1403;
        background: var(--you);
        border-color: var(--you);
        font-weight: 600;
      }
      .chip.agent {
        color: var(--agent);
        border-color: color-mix(in srgb, var(--agent) 40%, var(--line));
      }
      .chip.good {
        color: var(--good);
        border-color: color-mix(in srgb, var(--good) 40%, var(--line));
      }
      .empty {
        color: var(--muted);
        font-size: 12px;
        padding: 6px 4px;
      }
      .shelf {
        border-top: 1px solid var(--line);
        padding: 10px 20px 14px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .shelf b {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--shelf);
      }
      .shelf button {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 10px;
        cursor: pointer;
        color: var(--muted);
      }
      .lessons {
        padding: 18px 20px;
        overflow-y: auto;
        max-width: 820px;
      }
      .lesson {
        border-left: 2px solid var(--you);
        padding: 2px 0 2px 12px;
        margin: 0 0 16px;
      }
      .lesson p {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .lesson a {
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
      }

      /* an idea's thread: chat, the playable, what we know */
      .thread {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      .thread .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      .thread .bar input {
        flex: 1;
        min-width: 200px;
        background: none;
        border: 0;
        outline: none;
        font-size: 16px;
        font-weight: 650;
      }
      .btn {
        background: var(--you);
        color: #1b1403;
        border: 0;
        border-radius: 8px;
        padding: 6px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.alt {
        background: none;
        color: var(--text);
        border: 1px solid var(--line);
        font-weight: 500;
      }
      .btn.alt:hover {
        border-color: var(--you);
      }
      .panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(320px, 400px) 1fr 260px;
      }
      .chat {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--line);
      }
      .msgs {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 92%;
        padding: 8px 11px;
        border-radius: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .msg.user {
        align-self: flex-end;
        background: #33373e;
      }
      .msg.agent {
        align-self: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      .msg.note {
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 2px 8px;
      }
      .msg .built {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--you);
        cursor: pointer;
        background: none;
        border: 0;
        padding: 0;
      }
      .chat .composer {
        margin: 0 12px 12px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        padding: 0 14px 8px;
      }
      .stage {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .versions {
        display: flex;
        gap: 6px;
        padding: 10px 14px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
      }
      .versions button {
        background: none;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 2px 10px;
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
      }
      .versions button.on {
        background: var(--you);
        border-color: var(--you);
        color: #1b1403;
        font-weight: 600;
      }
      .versions span {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .frame {
        flex: 1;
        min-height: 0;
        padding: 12px;
        background: #0c0d0e;
      }
      .frame iframe {
        width: 100%;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .frame .none {
        color: var(--muted);
        max-width: 320px;
        text-align: center;
      }
      .know {
        border-left: 1px solid var(--line);
        padding: 14px;
        overflow-y: auto;
      }
      .mainview {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 260px;
      }
      .know p {
        margin: 0 0 8px;
      }
      .know label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 4px;
      }
      .know textarea {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
        resize: vertical;
        margin-bottom: 16px;
      }
      .know textarea:focus {
        border-color: var(--you);
      }
      .know .from {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .know .from a {
        color: var(--text);
        cursor: pointer;
        text-decoration: underline;
      }
      details {
        border-top: 1px solid var(--line);
        padding-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }
      details summary {
        cursor: pointer;
      }
      @media (max-width: 1000px) {
        .panes {
          grid-template-columns: 1fr;
          grid-auto-rows: minmax(360px, auto);
          overflow-y: auto;
        }
        .chat,
        .know {
          border: 0;
          border-bottom: 1px solid var(--line);
        }
        .board {
          grid-template-columns: repeat(6, 240px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tally <small>idea board</small></h1>
      <span class="tag">prototype · one fictional app, features evolve on branches · saved in this browser</span>
      <span id="waiting" class="waiting"></span>
      <span class="spacer"></span>
      <div class="tabs">
        <button id="tab-board" class="on">Board</button>
        <button id="tab-lessons">Lessons</button>
        <button id="tab-main" title="The app as it is on main">Main</button>
      </div>
      <button class="ghost" id="reset" title="Throw away your changes and restore the seed ideas">Reset</button>
    </header>
    <div class="new">
      <form class="composer" id="new">
        <textarea id="new-text" rows="1" placeholder="A feature idea for Tally? Say it like you would to a teammate. It becomes a thread and a branch."></textarea>
        <button class="send">Start</button>
      </form>
    </div>
    <main id="main"></main>
    <div id="thread"></div>

    <script>
      const PRODUCT = "Tally, a small web app freelancers use to track time per client project";
      const STAGES = [
        { id: "idea", name: "Idea", who: "parked, costs nothing" },
        { id: "exploring", name: "Exploring", who: "you and the agent are shaping it" },
        { id: "play", name: "Play", who: "your turn: poke at it", you: true },
        { id: "learned", name: "Regroup", who: "your turn: decide", you: true },
        { id: "building", name: "Building on main", who: "being merged for real" },
        { id: "done", name: "In use", who: "on main, the loop closed" },
      ];
      const KEY = "idea-board-proto-v3";

      // The existing app. Seed branches are the same source with a feature switched on.
      const app = (f = {}) => `<!doctype html>
<html><head><meta charset="utf-8"><title>Tally</title><style>
body{margin:0;font:14px system-ui;background:#f6f7f9;color:#1c2330}
header{display:flex;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid #e3e6ec}
header b{font-size:16px}
main{max-width:720px;margin:0 auto;padding:20px}
.bar{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:12px;margin-bottom:12px}
.bar.warn{background:#fff7e0;border-color:#f0d58a}
input,select,button{font:inherit;padding:7px 10px;border:1px solid #cfd5df;border-radius:7px;background:#fff}
input,.bar>span{flex:1}
#clock{flex:none;font:600 20px ui-monospace,monospace;min-width:92px;text-align:right}
button{cursor:pointer}button.go{background:#2456e6;color:#fff;border-color:#2456e6}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#6b7485;margin:20px 0 8px}
.row{display:flex;gap:12px;background:#fff;border:1px solid #e3e6ec;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.row span{flex:1}.row i{font-style:normal;color:#6b7485}.row b{font-family:ui-monospace,monospace}
.hint{color:#6b7485;font-size:12px;margin:-4px 2px 12px}
</style></head><body>
<header><b>Tally</b><span>This week <b id="week"></b></span></header>
<main>${f.idle ? `
<div class="bar warn" id="idle" style="display:none"><span>You were away for 12 minutes while the timer ran.</span><button onclick="idle('kept')">Keep</button><button onclick="idle('discarded')">Discard</button><button onclick="idle('split into a new entry')">Split</button></div>` : ""}${f.quick ? `
<div class="bar"><input id="q" placeholder="Quick entry: 1h30 acme fix login" onkeydown="if(event.key==='Enter')quick()"><button onclick="quick()">Add</button></div>` : ""}
<div class="bar"><select id="project"><option>Acme</option><option>Northwind</option><option>Internal</option></select>
<input id="desc" placeholder="What are you working on?"><span id="clock">0:00:00</span><button class="go" id="toggle" onclick="toggle()">Start</button></div>${f.space ? `
<p class="hint">Space starts and stops the timer.</p>` : ""}${f.idle ? `
<p class="hint" id="idleMsg"><button onclick="document.getElementById('idle').style.display='flex'">Simulate coming back after 12 minutes away</button></p>` : ""}
<h2>Today</h2><div id="list"></div>
</main>
<script>
var entries=[{d:"Fix login redirect",p:"Acme",m:95},{d:"Standup",p:"Internal",m:15},{d:"Invoice export",p:"Northwind",m:140}];
var weekBase=1130,started=null,tick=null;
function fmt(m){return Math.floor(m/60)+"h "+("0"+m%60).slice(-2)+"m"}
function render(){var h="",sum=0;entries.forEach(function(e){sum+=e.m;h+='<div class="row"><span>'+e.d+'</span><i>'+e.p+'</i><b>'+fmt(e.m)+'</b></div>'});
document.getElementById("list").innerHTML=h;document.getElementById("week").textContent=fmt(weekBase+sum)}
function toggle(){var b=document.getElementById("toggle");
if(started){clearInterval(tick);var s=Math.round((Date.now()-started)/1000);
entries.unshift({d:document.getElementById("desc").value||"Untitled",p:document.getElementById("project").value,m:Math.max(1,Math.round(s/60))});
started=null;b.textContent="Start";document.getElementById("clock").textContent="0:00:00";document.getElementById("desc").value="";render()}
else{started=Date.now();b.textContent="Stop";tick=setInterval(function(){var s=Math.floor((Date.now()-started)/1000);
document.getElementById("clock").textContent=Math.floor(s/3600)+":"+("0"+Math.floor(s/60)%60).slice(-2)+":"+("0"+s%60).slice(-2)},500)}}${f.quick ? `
function quick(){var q=document.getElementById("q"),parts=q.value.trim().split(" "),t=parts.shift()||"";
var h=t.indexOf("h")>=0?parseInt(t)||0:0,mm=parseInt(t.split("h").pop())||0,p=parts.shift();
if(!p||!parts.length||!(h||mm)){q.style.borderColor="#d33";return}
entries.unshift({d:parts.join(" "),p:p.charAt(0).toUpperCase()+p.slice(1),m:h*60+mm});q.value="";q.style.borderColor="";render()}` : ""}${f.idle ? `
function idle(what){document.getElementById("idle").style.display="none";document.getElementById("idleMsg").textContent="12 minutes "+what+"."}` : ""}${f.space ? `
document.addEventListener("keydown",function(e){if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();toggle()}});` : ""}
render();
<\/script></body></html>`;

      const seed = () => ({
        main: {
          rev: 1,
          html: app(),
          log: ["Timer with project and description", "Today's entries", "Week total in the header"],
        },
        ideas: [
          {
            id: "quick",
            title: "Log time by typing one line: 1h30 acme fix login",
            stage: "play",
            base: 1,
            became: "A quick-entry field above the timer that parses duration, project and description.",
            lessons: ["I log most of my time after the fact. The timer alone does not cover how I work."],
            versions: [{ html: app({ quick: true }), note: "Quick-entry field above the timer" }],
            chat: [
              { role: "user", text: "Half my entries are things I already did. Starting a timer for those is silly. Let me type one line instead." },
              { role: "agent", text: "Added a quick-entry field above the timer on a branch. Type 1h30 acme fix login and press Enter; the order is duration, project, description.", built: 1 },
            ],
          },
          {
            id: "idle",
            title: "Idle detection: ask what to do with time I was away",
            stage: "learned",
            base: 1,
            became: "A banner when you come back, with Keep, Discard and Split.",
            lessons: [
              "Keep and Discard are enough. Split made me stop and think in the middle of work.",
              "It has to ask the moment I come back. As a later notification it would be noise.",
            ],
            versions: [{ html: app({ idle: true }), note: "Banner with Keep, Discard, Split" }],
            chat: [
              { role: "user", text: "I leave the timer running over lunch all the time. Catch that." },
              { role: "agent", text: "There is a banner now that appears when you return after being away. Real idle detection needs the desktop shell, so the branch has a button that simulates coming back.", built: 1 },
              { role: "user", text: "Split is too much. I just want keep or throw away." },
              { role: "agent", text: "Noted as a lesson. I can drop Split in the next version, or you can regroup with it as is." },
            ],
          },
          {
            id: "rates",
            title: "Billing rates and currencies per client",
            stage: "shelved",
            decision: "Pivot",
            became: "A settings page with rate, currency and tax per client.",
            lessons: [
              "Rates pulled in currencies, taxes and invoices. That is a second product.",
              "The one thing I actually needed from it was rounding to billable blocks.",
            ],
            versions: [],
            chat: [],
          },
          {
            id: "round",
            parent: "rates",
            title: "Round entries to 15-minute blocks per client",
            stage: "idea",
            lessons: [],
            versions: [],
            chat: [],
          },
          {
            id: "invoice",
            title: "Weekly invoice preview straight from the entries",
            stage: "exploring",
            lessons: [],
            versions: [],
            chat: [
              { role: "user", text: "End of the week I copy all this into an invoice by hand. Show me the invoice." },
              { role: "agent", text: "Before I build: one invoice per client for the week, or one line per entry? That decides whether this is a summary view or an export." },
            ],
          },
          {
            id: "space",
            title: "Space starts and stops the timer",
            stage: "building",
            decision: "Adopt",
            base: 1,
            became: "A global shortcut, ignored while typing in a field.",
            lessons: ["It must not fire while I type a description. That bit me in the first version."],
            versions: [{ html: app({ space: true }), note: "Space toggles the timer outside inputs" }],
            chat: [{ role: "note", text: "Adopted. Waiting to be merged into main." }],
          },
          {
            id: "week",
            title: "Week total in the header",
            stage: "done",
            decision: "Adopt",
            became: "Always visible, updates as entries land.",
            lessons: ["I check the weekly number far more than the daily one."],
            versions: [],
            chat: [],
          },
        ],
      });

      let { main, ideas } = load();
      let view = "board";
      let openId = null;
      let shownVersion = null; // index into the open idea's versions, -1 for main; null follows the latest
      let busy = null; // { id, text, building } while the agent answers

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY));
          if (saved?.main && Array.isArray(saved.ideas)) return saved;
        } catch {}
        return seed();
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify({ main, ideas }));
      }
      const byId = (id) => ideas.find((i) => i.id === id);
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const lastAgent = (i) => i.chat.length && i.chat[i.chat.length - 1].role === "agent";
      const needsYou = (i) => i.stage === "play" || i.stage === "learned" || (i.stage === "exploring" && lastAgent(i) && busy?.id !== i.id);
      const live = (i) => ["exploring", "play", "learned", "building"].includes(i.stage);
      // A branch is behind when main gained a merge after the branch was cut.
      const behind = (i) => live(i) && i.versions.length > 0 && i.base !== main.rev;

      /* ---------- the agent ---------- */

      function systemPrompt(i, rebase) {
        const parent = i.parent && byId(i.parent);
        const latest = i.versions[i.versions.length - 1];
        return `You are a developer agent working on one feature idea inside an existing app. The app: ${PRODUCT}. The whole app is one HTML file. The feature lives on its own branch: you change the app's source so the product owner can play with the feature inside the real app, then you iterate from their feedback in this chat.

Rules:
- Reply in the language the user writes in. Be brief and concrete: 1 to 4 plain sentences, no headings, no lists, no flattery. Talk like a developer to the product owner.
- If the user only asks a question, answer it and change nothing.
- When the user wants to see something or gives feedback, change the app: after your sentences, output the COMPLETE modified app as one HTML document in a single \`\`\`html fenced block. Start from the source given below, keep everything that already works and the existing look, and change only what this feature needs. Inline CSS and JS only, no external files. Never a diff, always the whole file. Say in your sentences what changed and what to try.
- When the user tells you something they learned, liked, disliked or were surprised by, record it on its own line: LESSON: <one sentence, in their words and language>
- When the feature has turned into something different from its title, add on its own line: BECAME: <one line>
- Put LESSON and BECAME lines before the html block.

The feature idea: ${i.title}
${i.became ? "What it has become so far: " + i.became : ""}
${i.lessons.length ? "Lessons so far:\n- " + i.lessons.join("\n- ") : ""}
${parent ? `This idea grew out of "${parent.title}". Lessons carried over:\n- ${parent.lessons.join("\n- ")}` : ""}
${latest ? `The branch's current source (v${i.versions.length}):\n\`\`\`html\n${latest.html}\n\`\`\`` : `No branch yet. The app on main:\n\`\`\`html\n${main.html}\n\`\`\``}
${rebase ? `Main has changed since this branch was cut. Rebase: start from the main below and re-apply this branch's feature on top of it, so the result has everything main has plus the feature.\n\`\`\`html\n${main.html}\n\`\`\`` : ""}`;
      }

      function parseReply(raw) {
        let text = raw.replace(/<think>[\s\S]*?(<\/think>|$)/g, "");
        const lessons = [];
        let became = null;
        let html = null;
        let building = false;
        const fence = text.indexOf("```html");
        if (fence >= 0) {
          const rest = text.slice(fence + 7);
          const end = rest.indexOf("```");
          building = end < 0;
          if (end >= 0) html = rest.slice(0, end).trim();
          text = text.slice(0, fence) + (end >= 0 ? rest.slice(end + 3) : "");
        }
        text = text
          .split("\n")
          .filter((line) => {
            const m = line.match(/^\s*\**(LESSON|BECAME)\**:\**\s*(.+)$/);
            if (!m) return true;
            if (m[1] === "LESSON") lessons.push(m[2].trim());
            else became = m[2].trim();
            return false;
          })
          .join("\n")
          .trim();
        return { text, lessons, became, html, building };
      }

      async function ask(i, userText, rebase = false) {
        i.chat.push(rebase ? { role: "note", text: userText } : { role: "user", text: userText });
        if (i.stage === "idea") i.stage = "exploring";
        busy = { id: i.id, text: "", building: false };
        save();
        render();
        const history = i.chat.filter((m) => m.role !== "note").slice(-12).map((m) => ({
          role: m.role === "user" ? "user" : "assistant",
          content: m.text + (m.built ? `\n[changed the app: branch v${m.built}]` : ""),
        }));
        if (rebase) history.push({ role: "user", content: "Rebase this branch on the current main." });
        const messages = [{ role: "system", content: systemPrompt(i, rebase) }, ...history];
        let raw = "";
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          if (!res.ok) throw new Error("unavailable");
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith("data:")) continue;
              const data = line.slice(5).trim();
              if (data === "[DONE]") continue;
              try {
                raw += JSON.parse(data).choices?.[0]?.delta?.content ?? "";
              } catch {}
            }
            const partial = parseReply(raw);
            busy.text = partial.text;
            busy.building = partial.building ? raw.length : false;
            patchLive();
          }
          const reply = parseReply(raw);
          const msg = { role: "agent", text: reply.text || (reply.html ? "Changed the app." : "(no answer)") };
          if (reply.html) {
            if (!i.versions.length || rebase) i.base = main.rev;
            i.versions.push({ html: reply.html, note: rebase ? "Rebased on main" : firstSentence(msg.text) });
            msg.built = i.versions.length;
            if (i.stage === "exploring" || i.stage === "learned") i.stage = "play";
            if (openId === i.id) shownVersion = null;
          }
          for (const l of reply.lessons) if (!i.lessons.includes(l)) i.lessons.push(l);
          if (reply.became) i.became = reply.became;
          i.chat.push(msg);
        } catch {
          i.chat.push({ role: "note", text: "The agent could not be reached (it runs on the local model on nika). Send again to retry." });
        }
        busy = null;
        save();
        render();
      }
      const firstSentence = (s) => (s.match(/^[^.!?\n]+[.!?]?/) || [""])[0].slice(0, 90);

      /* ---------- loop transitions ---------- */

      function act(i, name) {
        const note = (text) => i.chat.push({ role: "note", text });
        if (name === "regroup") i.stage = "learned";
        else if (name === "more") i.stage = i.versions.length ? "play" : "exploring";
        else if (name === "rebase") ask(i, "Main moved on. Rebasing this branch on it.", true);
        else if (name === "Adopt") {
          i.stage = "building";
          i.decision = "Adopt";
          note("Adopted. In T3 an implementation thread now redoes this properly on main, briefed with what it became and the lessons. Here, Merge puts the branch's code into main as it is.");
        } else if (name === "Shelve") {
          i.stage = "shelved";
          i.decision = "Shelve";
          note("Shelved. The branch is dropped, the lessons stay on the board.");
        } else if (name === "Pivot") {
          i.stage = "shelved";
          i.decision = "Pivot";
          note("Pivoted into a new idea that carries these lessons.");
          const child = { id: "i" + Date.now(), parent: i.id, title: "", stage: "idea", lessons: [], versions: [], chat: [] };
          ideas.unshift(child);
          openId = child.id;
          shownVersion = null;
        } else if (name === "merge") {
          const latest = i.versions[i.versions.length - 1];
          if (latest) {
            main = { rev: main.rev + 1, html: latest.html, log: [...main.log, i.title] };
            i.base = main.rev;
          }
          i.stage = "done";
          note("Merged. This is main now, and every other open branch is one merge behind.");
        } else if (name === "revive") {
          i.stage = i.versions.length ? "play" : "idea";
          delete i.decision;
        } else if (name === "delete") {
          ideas = ideas.filter((x) => x !== i);
          openId = null;
        }
      }

      /* ---------- rendering ---------- */

      function cardHtml(i) {
        const parent = i.parent && byId(i.parent);
        const chips = [];
        if (busy?.id === i.id) chips.push(`<span class="chip agent">agent ${busy.building ? "coding" : "replying"}</span>`);
        else if (i.stage === "exploring" && lastAgent(i)) chips.push(`<span class="chip play">asks you</span>`);
        if (i.versions.length && i.stage !== "done") chips.push(`<span class="chip ${i.stage === "play" ? "play" : ""}">▶ branch v${i.versions.length}</span>`);
        if (behind(i)) chips.push(`<span class="chip agent">behind main</span>`);
        if (i.lessons.length) chips.push(`<span class="chip good">${i.lessons.length} lesson${i.lessons.length > 1 ? "s" : ""}</span>`);
        if (parent) chips.push(`<span class="chip">from: ${esc(parent.title.slice(0, 20))}…</span>`);
        const last = i.chat.filter((m) => m.role !== "note").at(-1);
        return `<div class="card" draggable="true" data-id="${i.id}">
          <div class="title">${esc(i.title) || "<em>Untitled idea</em>"}</div>
          ${i.became ? `<div class="sub">${esc(i.became)}</div>` : ""}
          ${last && ["exploring", "play", "learned"].includes(i.stage) ? `<div class="last">${last.role === "user" ? "You: " : ""}${esc(last.text)}</div>` : ""}
          ${chips.length ? `<div class="row">${chips.join("")}</div>` : ""}
        </div>`;
      }

      function render() {
        const waiting = ideas.filter(needsYou).length;
        document.getElementById("waiting").textContent = waiting ? `${waiting} waiting on you` : "Nothing waits on you";
        for (const tab of ["board", "lessons", "main"]) document.getElementById("tab-" + tab).className = view === tab ? "on" : "";
        const el = document.getElementById("main");
        if (view === "main") {
          el.innerHTML = `<div class="mainview"><div class="frame"><iframe sandbox="allow-scripts" title="Tally on main"></iframe></div>
            <div class="know"><label>On main, in order</label>${main.log.map((l) => `<p>${esc(l)}</p>`).join("")}
            <p class="empty">This is the app everything branches from. Adopted ideas land here.</p></div></div>`;
          el.querySelector("iframe").srcdoc = main.html;
        } else if (view === "lessons") {
          const all = ideas.flatMap((i) => i.lessons.map((l) => ({ l, i })));
          el.innerHTML = `<div class="lessons">${
            all
              .map(({ l, i }) => `<div class="lesson"><p>${esc(l)}</p><a data-open="${i.id}">${esc(i.title)}${i.decision ? " · " + i.decision : ""}</a></div>`)
              .join("") || `<p class="empty">No lessons yet.</p>`
          }</div>`;
        } else {
          const shelved = ideas.filter((i) => i.stage === "shelved");
          el.innerHTML =
            `<div class="board">${STAGES.map((s) => {
              const list = ideas.filter((i) => i.stage === s.id);
              return `<section class="col ${s.you ? "you" : ""}" data-stage="${s.id}">
                <h2>${s.name}<span>${list.length}</span></h2>
                <div class="who">${s.who}</div>
                <div class="cards">${list.map(cardHtml).join("") || `<div class="empty">Empty</div>`}</div>
              </section>`;
            }).join("")}</div>` +
            `<div class="shelf"><b>Shelf</b>${
              shelved.map((i) => `<button data-open="${i.id}">${esc(i.title)} · ${i.lessons.length} lessons</button>`).join("") ||
              `<span class="empty">Shelved ideas keep their lessons here.</span>`
            }</div>`;
        }
        renderThread();
      }

      const msgHtml = (m) =>
        `<div class="msg ${m.role}">${esc(m.text)}${m.built ? `<button class="built" data-version="${m.built - 1}">▶ Branch v${m.built}, open it</button>` : ""}</div>`;

      function liveHtml() {
        const status = busy.building ? `Changing the app… ${busy.building} characters written` : busy.text ? "" : "Thinking… the local model can take a minute to wake up";
        return `${esc(busy.text)}${status ? `<span style="display:block;color:var(--agent);font-size:12px">${status}</span>` : ""}`;
      }
      function patchLive() {
        const el = document.getElementById("live");
        if (!el) return;
        el.innerHTML = liveHtml();
        el.parentElement.scrollTop = el.parentElement.scrollHeight;
      }

      function renderThread() {
        const el = document.getElementById("thread");
        const i = openId && byId(openId);
        if (!i) return (el.innerHTML = "");
        const draft = el.querySelector("#say")?.value ?? "";
        const parent = i.parent && byId(i.parent);
        const stageName = i.stage === "shelved" ? "Shelved" : STAGES.find((s) => s.id === i.stage).name;
        const vIndex = shownVersion ?? i.versions.length - 1;
        const version = i.versions[vIndex];
        const working = busy?.id === i.id;
        const blocked = busy && !working;
        let actions = behind(i) && !busy ? `<button class="btn alt" data-act="rebase">Rebase on main</button>` : "";
        if (i.stage === "play") actions += `<button class="btn" data-act="regroup">Done playing, regroup</button>`;
        if (i.stage === "learned")
          actions += `<button class="btn" data-act="Adopt">Adopt into main</button><button class="btn alt" data-act="Pivot">Pivot into a new idea</button>
            <button class="btn alt" data-act="Shelve">Shelve, keep lessons</button><button class="btn alt" data-act="more">Keep iterating</button>`;
        if (i.stage === "building") actions += `<button class="btn" data-act="merge">Merge into main</button>`;
        if (i.stage === "shelved") actions += `<button class="btn alt" data-act="revive">Bring it back</button>`;
        el.innerHTML = `<div class="thread">
          <div class="bar">
            <button class="ghost" data-close>← Board</button>
            <input data-f="title" value="${esc(i.title)}" placeholder="The feature idea in one line" />
            <span class="chip">${stageName}${i.decision ? " · " + i.decision : ""}</span>
            ${actions}
          </div>
          <div class="panes">
            <div class="chat">
              <div class="msgs" id="msgs">
                ${i.chat.map(msgHtml).join("") || `<div class="msg note">${parent ? "A fresh idea that carries the lessons of its parent. Say what it is." : "No conversation yet. Describe the feature, or ask the agent to try a first version in the app."}</div>`}
                ${working ? `<div class="msg agent" id="live">${liveHtml()}</div>` : ""}
              </div>
              ${blocked ? `<div class="hint">The agent is busy in another thread. The local model takes one at a time.</div>` : ""}
              <form class="composer" id="talk">
                <textarea id="say" rows="1" placeholder="${i.versions.length ? "Say what you noticed, ask about it, or ask for a change" : "Talk the feature through, or ask for a first version"}"></textarea>
                <button class="send" ${busy ? "disabled" : ""}>Send</button>
              </form>
            </div>
            <div class="stage">
              <div class="versions">
                <button class="${version ? "" : "on"}" data-version="-1">main</button>
                ${i.versions.map((v, n) => `<button class="${n === vIndex ? "on" : ""}" data-version="${n}">v${n + 1}</button>`).join("")}
                <span>${version ? esc(version.note) : i.versions.length ? "The app without this feature" : "The app on main. The feature shows up here once the agent builds it."}</span>
              </div>
              <div class="frame"><iframe sandbox="allow-scripts" title="${version ? "Branch v" + (vIndex + 1) : "Tally on main"}"></iframe></div>
            </div>
            <div class="know">
              ${parent ? `<div class="from">Grew out of <a data-open="${parent.id}">${esc(parent.title)}</a>${parent.lessons.length ? `<br />Carried: ${parent.lessons.map(esc).join(" / ")}` : ""}</div>` : ""}
              <label>What it became</label>
              <textarea data-f="became" rows="3" placeholder="One line. The agent fills this in as the idea shifts.">${esc(i.became)}</textarea>
              <label>Lessons (one per line)</label>
              <textarea data-f="lessons" rows="9" placeholder="The agent writes down what you say you learned. Edit freely.">${esc(i.lessons.join("\n"))}</textarea>
              <details><summary>Technical detail</summary>
                <p>Branch cut from main r${i.base ?? main.rev}; main is at r${main.rev}. Each version is the whole app's source, rewritten by the local model on nika. No git branch or T3 thread behind it yet.</p>
                <button class="ghost" data-act="delete">Delete this idea</button>
              </details>
            </div>
          </div>
        </div>`;
        el.querySelector("iframe").srcdoc = version ? version.html : main.html;
        const msgs = el.querySelector("#msgs");
        msgs.scrollTop = msgs.scrollHeight;
        const say = el.querySelector("#say");
        say.value = draft;
        if (!i.title) el.querySelector('[data-f="title"]').focus();
        else say.focus();
      }

      /* ---------- events ---------- */

      function open(id) {
        openId = id;
        shownVersion = null;
      }

      document.addEventListener("click", (e) => {
        const t = e.target;
        if (t.closest("[data-version]")) shownVersion = Number(t.closest("[data-version]").dataset.version);
        else if (t.closest("[data-act]")) act(byId(openId), t.closest("[data-act]").dataset.act);
        else if (t.closest("[data-open]")) open(t.closest("[data-open]").dataset.open);
        else if (t.closest("[data-close]")) openId = null;
        else if (t.closest(".card")) open(t.closest(".card").dataset.id);
        else if (t.id?.startsWith("tab-")) view = t.id.slice(4);
        else if (t.id === "reset") {
          if (!confirm("Restore the seed app and ideas, and drop your changes?")) return;
          ({ main, ideas } = seed());
          openId = null;
        } else return;
        save();
        render();
      });

      // Field edits save without re-rendering, so typing keeps its caret.
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.tagName === "TEXTAREA" && t.closest(".composer")) {
          t.style.height = "auto";
          t.style.height = t.scrollHeight + "px";
        }
        const f = t.dataset?.f;
        const i = openId && byId(openId);
        if (!f || !i) return;
        if (f === "lessons") i.lessons = t.value.split("\n").map((l) => l.trim()).filter(Boolean);
        else i[f] = t.value;
        save();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && openId) {
          openId = null;
          render();
        }
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.target.closest?.(".composer")) {
          e.preventDefault();
          e.target.closest("form").requestSubmit();
        }
      });

      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const box = e.target.querySelector("textarea");
        const text = box.value.trim();
        if (!text || busy) return;
        box.value = "";
        if (e.target.id === "new") {
          const idea = { id: "i" + Date.now(), title: firstSentence(text), stage: "idea", lessons: [], versions: [], chat: [] };
          ideas.unshift(idea);
          view = "board";
          open(idea.id);
          ask(idea, text);
        } else {
          const i = byId(openId);
          if (!i.title) i.title = firstSentence(text);
          ask(i, text);
        }
      });

      // Drag a card to any column.
      document.addEventListener("dragstart", (e) => {
        const card = e.target.closest?.(".card");
        if (card) e.dataTransfer.setData("text/plain", card.dataset.id);
      });
      document.addEventListener("dragover", (e) => {
        const col = e.target.closest?.(".col");
        if (!col) return;
        e.preventDefault();
        col.classList.add("over");
      });
      document.addEventListener("dragleave", (e) => e.target.closest?.(".col")?.classList.remove("over"));
      document.addEventListener("drop", (e) => {
        const col = e.target.closest?.(".col");
        const i = byId(e.dataTransfer.getData("text/plain"));
        if (!col || !i) return;
        e.preventDefault();
        i.stage = col.dataset.stage;
        save();
        render();
      });

      render();
</script>
  </body>
</html>
